[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vivere-con-il-cane"
version = "0.1.0"
description = "Vivere con il Cane - Django project"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2,<6.1",
    "Pillow>=10.0,<11.0",
    "whitenoise>=6.0",
    "gunicorn>=21.0",
    "python-dotenv>=1.0.0",
    "django-allauth>=64.0,<66.0",
    "dj-database-url>=2.0",
    "requests>=2.31.0",
    "xhtml2pdf>=0.2.12",
    "djangorestframework>=3.14.0",
    "python-json-logger>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
]

[project.scripts]
manage = "manage:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
