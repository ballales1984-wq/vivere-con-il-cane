services:
  - type: web
    name: vivere-con-il-cane
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py loaddata blog/fixtures/blog_data.json blog/fixtures/initial_data.json knowledge/fixtures/knowledge_data.json && python manage.py collectstatic --noinput
    startCommand: bash run.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /
    healthCheckTimeout: 30
    healthCheckInterval: 10
    postDeployCommand: python manage.py loaddata blog/fixtures/blog_data.json blog/fixtures/initial_data.json knowledge/fixtures/knowledge_data.json